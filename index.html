<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number Ninjas Leaderboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Subtle Background Math Elements -->
    <div class="math-bg">
        <span class="math-sym sym-1">π</span>
        <span class="math-sym sym-2">∞</span>
        <span class="math-sym sym-3">∑</span>
        <span class="math-sym sym-4">∫</span>
        <span class="math-sym sym-5">√</span>
        <span class="math-sym sym-6">θ</span>
    </div>

    <div class="container fade-in">
        <!-- HEADER -->
        <header>
            <div class="logo-container">
                <img src="assets/logo.png" alt="Math Club Logo" id="club-logo">
            </div>
            <div class="header-titles">
                <h2 id="club-name">MITS Mathematics Club</h2>
                <h1 id="event-name">NUMBER NINJAS</h1>
                <p id="event-tagline">Think • Solve • Innovate</p>
            </div>
        </header>

        <!-- ROUND PROGRESS TRACKER -->
        <section class="round-tracker" id="round-tracker">
            <!-- Dynamically populated from JS -->
        </section>

        <!-- LEADERBOARD TITLE -->
        <section class="leaderboard-title">
            <h2>LEADERBOARD</h2>
            <div class="divider"></div>
        </section>

        <!-- LEADERBOARD TABLE -->
        <main class="table-container">
            <table id="leaderboard-table">
                <thead>
                    <tr>
                        <th class="col-rank">Rank</th>
                        <th class="col-team">Team Name</th>
                        <th class="col-score">Round 1</th>
                        <th class="col-score">Round 2</th>
                        <th class="col-score">Round 3</th>
                        <th class="col-total">Total</th>
                    </tr>
                </thead>
                <tbody id="leaderboard-body">
                    <!-- Populated by JS -->
                </tbody>
            </table>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
